stages: [check, test, build, deploy]

default:
  image: node:22-bookworm
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# Tests start real Slidev processes; E2E needs Playwright's browsers.
.slidev:
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm --dir apps/server/runtime install --ignore-workspace --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

lint:
  stage: check
  script: pnpm lint

typecheck:
  stage: check
  script: pnpm typecheck

unit:
  extends: .slidev
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: slides
    POSTGRES_PASSWORD: slides
    POSTGRES_DB: slides
    # Run the server suite against real Postgres; locally it falls back to PGlite.
    TEST_DATABASE_URL: postgres://slides:slides@postgres:5432/slides
  script: pnpm test

e2e:
  extends: .slidev
  stage: test
  script: pnpm test:e2e
  artifacts:
    when: on_failure
    paths: [playwright-report, test-results]
    expire_in: 1 week

# Real model calls against the acceptance criteria; needs LLM_BASE_URL, LLM_MODEL, LLM_API_KEY.
eval:
  extends: .slidev
  stage: test
  script: pnpm --filter @slidango/server eval
  rules:
    - if: $LLM_BASE_URL
      when: manual
      allow_failure: true

image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  before_script: []
  cache: []
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push --all-tags "$CI_REGISTRY_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: alpine:3.22
  before_script: []
  cache: []
  # Needs DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH and an SSH_PRIVATE_KEY file variable.
  script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh -i "$SSH_PRIVATE_KEY" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST"
      "cd $DEPLOY_PATH && APP_IMAGE=$CI_REGISTRY_IMAGE:latest docker compose pull app && APP_IMAGE=$CI_REGISTRY_IMAGE:latest docker compose up -d"
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
