# Only for AUTH_MODE=oidc: oauth2-proxy in front of the app (Caddy forward_auth).
# Enabled via COMPOSE_FILE=docker-compose.yml:docker-compose.oidc.yml in .env.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL in .env}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OIDC_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_REDIRECT_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env (see .env.example)}/oauth2/callback
      # One login for the app and every preview subdomain.
      OAUTH2_PROXY_COOKIE_DOMAINS: .${PREVIEW_DOMAIN:?set PREVIEW_DOMAIN in .env}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${PREVIEW_DOMAIN:?set PREVIEW_DOMAIN in .env}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

  caddy:
    depends_on: [oauth2-proxy]
